<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentação - Versão API | DNA API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Voltar</a>
        
        <header>
            <h1>🔖 Versão da API</h1>
        </header>

        <section class="endpoint">
            <h2>Consultar Versão Atual</h2>
            <p><span class="method method-get">GET</span></p>
            <div class="endpoint-route">
                BaseRoute/version
            </div>
            
            <div class="filters">
                <strong>Descrição:</strong>
                <p>Retorna a versão atual da API em execução.</p>
            </div>

            <div class="example">
                <strong>Exemplo de Resposta:</strong>
                <div class="endpoint-route">
{
  "version": "1.0.0"
}
                </div>
            </div>
        </section>
    </div>
</body>
</html>
